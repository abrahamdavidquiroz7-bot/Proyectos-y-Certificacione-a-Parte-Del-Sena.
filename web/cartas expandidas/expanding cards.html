
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <title>document</title>
    
<style>
@import url('https://fonts.googleapis.com/css?family=Muli&display=swap');

.container{

    display: flex;
    align-items: center;
    justify-content: center;
}
body{
  box-sizing: border-box;
    background-color: #222;


}


.panel.active{
    flex:3;

}


.panel{
    -webkit-transition: all 700ms ease-in;
    border-radius: 25px;
    flex:1;
    height: 400px;
    width: 40opx;
    display: flex;
  
    position: relative;
}

h3{
    top:80%;
    left:20px;
      font-weight: bold;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    position: absolute;
    color:white;
}
</style>
   
</head>
<body>

  

    <div class="container">

        <div class="panel active" style="background-image: url('https://images.unsplash.com/photo-1558979158-65a1eaa08691?auto=format&fit=crop&w=1350&q=80')">
            <h3>EXPLORE THE WORLD</h3>
        </div>

        <div class="panel" style="background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1350&q=80')">
            <h3>EXPLORE MOUNTAINS</h3>
        </div>

        <div class="panel" style="background-image: url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1350&q=80')">
            <h3>EXPLORE NATURE</h3>
        </div>

        

        <div class="panel" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1350&q=80')">
            <h3>EXPLORE ADVENTURE</h3>
        </div>

    </div>

    <script>


const panels=document.querySelectorAll(".panel")
panels.forEach(function(panel){
    panel.addEventListener("click" ,function(){
        removeactiveclass()
        panel.classList.add("active")


    });

});

function removeactiveclass(){
panels.forEach(function(panel){
    panel.classList.remove("active")

})
}


</script>

</body>
</html>
